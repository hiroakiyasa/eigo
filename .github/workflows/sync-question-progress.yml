name: Sync question progress

on:
  push:
    branches: [main]
    paths:
      - 'question-sets/PAGE_*.json'
      - '.github/workflows/sync-question-progress.yml'
  workflow_dispatch:

concurrency:
  group: sync-question-progress-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate, mark completed, and publish progress
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          max_attempts=30
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Sync attempt ${attempt}/${max_attempts}"

            # Parallel question-set commits may advance main while this job is queued
            # or running. Always recompute progress from the latest remote main.
            git fetch origin main
            git reset --hard origin/main

            retry_needed=0
            for file in question-sets/PAGE_*.json; do
              [ -e "$file" ] || continue
              page="$(basename "$file" .json)"
              number=$((10#${page#PAGE_}))

              # Some parallel producers may preserve a valid 40-question payload but
              # copy an outdated display title. Normalize only page.title from the
              # manifest, and publish each repaired page as its own commit.
              node - "$file" "$number" <<'NODE'
          const fs = require('fs');
          const [file, rawNumber] = process.argv.slice(2);
          let data;
          try {
            data = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch {
            process.exit(0);
          }
          const manifest = JSON.parse(fs.readFileSync('data/page-manifest.json', 'utf8'));
          const expected = manifest.pages?.find((item) => item.number === Number(rawNumber));
          if (expected && data.page?.title !== expected.title) {
            data.page.title = expected.title;
            fs.writeFileSync(file, `${JSON.stringify(data)}\n`);
          }
          NODE

              if ! git diff --quiet -- "$file"; then
                git add "$file"
                git commit -m "fix(questions): match manifest title for page ${page#PAGE_} [skip ci]"
                if git push origin HEAD:main; then
                  echo "Normalized title: ${page}"
                else
                  echo "main advanced while normalizing ${page}; rebuilding from latest main"
                  retry_needed=1
                  break
                fi
              fi

              status="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("data/progress.json","utf8")); const n=Number(process.argv[1]); console.log(p.pages.find(x=>x.number===n)?.status ?? "missing")' "$number")"
              if [ "$status" = "pending" ]; then
                node scripts/validate-question-set.mjs "$file"
                node scripts/mark-complete.mjs "$page"
              fi
            done

            if [ "$retry_needed" -eq 1 ]; then
              sleep_seconds=$(( attempt < 5 ? attempt : 5 ))
              sleep "$sleep_seconds"
              continue
            fi

            node scripts/validate-repository.mjs

            if git diff --quiet -- data/progress.json CATALOG.md; then
              echo 'No progress changes.'
              exit 0
            fi

            git add data/progress.json CATALOG.md
            git commit -m 'chore(progress): sync completed question sets'

            if git push origin HEAD:main; then
              echo 'Progress sync pushed successfully.'
              exit 0
            fi

            # A parallel page commit advanced main after validation. Discard this
            # local sync commit, fetch the new head, and rebuild both files.
            sleep_seconds=$(( attempt < 5 ? attempt : 5 ))
            echo "main advanced during sync; retrying after ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done

          echo "Failed to publish progress after ${max_attempts} attempts."
          exit 1
