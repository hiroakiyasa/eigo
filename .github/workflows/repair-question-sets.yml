name: Inspect malformed question sets
on:
  push:
    paths:
      - '.github/workflows/repair-question-sets.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count complete question objects
        run: |
          node <<'NODE'
          const fs=require('fs');
          function extractObjects(s){
            const qpos=s.indexOf('"questions":['); if(qpos<0)return [];
            let i=s.indexOf('[',qpos)+1,out=[];
            while(i<s.length){
              while(i<s.length && /[\s,]/.test(s[i])) i++;
              if(s[i]!== '{') break;
              const start=i; let depth=0,str=false,esc=false,done=false;
              for(;i<s.length;i++){
                const c=s[i];
                if(str){ if(esc)esc=false; else if(c==='\\')esc=true; else if(c==='"')str=false; continue; }
                if(c==='"'){str=true;continue;}
                if(c==='{')depth++; else if(c==='}'){depth--; if(depth===0){out.push(s.slice(start,i+1)); i++; done=true; break;}}
              }
              if(!done) break;
            }
            return out;
          }
          for(let n=28;n<=43;n++){
            const p=`question-sets/PAGE_${String(n).padStart(4,'0')}.json`,s=fs.readFileSync(p,'utf8'),objs=extractObjects(s);
            let ids=[]; for(const o of objs){try{ids.push(JSON.parse(o).id)}catch{}}
            console.log(`${p} complete=${ids.length} last=${ids.at(-1)||'none'}`);
          }
          NODE
