name: Final repaired question validation and sync
on:
  push:
    paths:
      - '.github/workflows/repair-question-sets.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every existing question set and sync progress
        run: |
          set -euo pipefail
          for file in question-sets/PAGE_*.json; do
            node scripts/validate-question-set.mjs "$file"
            page="$(basename "$file" .json)"
            number=$((10#${page#PAGE_}))
            status="$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("data/progress.json","utf8"));const n=Number(process.argv[1]);console.log(p.pages.find(x=>x.number===n)?.status??"missing")' "$number")"
            if [ "$status" = "pending" ]; then
              node scripts/mark-complete.mjs "$page"
            fi
          done
          node scripts/validate-repository.mjs
      - name: Remove temporary repair scaffolding and commit final state
        run: |
          git config user.name 'TRAIL FUSION AI'
          git config user.email 'hiroakiyasa@yahoo.co.jp'
          rm -rf .repair
          git rm .github/workflows/repair-question-sets.yml
          git add data/progress.json CATALOG.md
          git commit -m 'fix(questions): finalize repaired sets through page 0043'
          git pull --rebase origin main
          git push
