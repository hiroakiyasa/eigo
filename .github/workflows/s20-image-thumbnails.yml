name: S20 image thumbnails

on:
  push:
    branches: [s20-page-0321-check]
    paths:
      - '.github/workflows/s20-image-thumbnails.yml'

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build thumbnails
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path('/tmp/s20-thumbnails')
          out.mkdir(parents=True, exist_ok=True)
          for number in range(322, 331):
              src = Path(f'pages/PAGE_{number:04d}.webp')
              with Image.open(src) as image:
                  image.thumbnail((470, 836))
                  image.convert('RGB').save(out / f'PAGE_{number:04d}.jpg', quality=82, optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s20-page-thumbnails
          path: /tmp/s20-thumbnails/*.jpg
          if-no-files-found: error
          compression-level: 6
