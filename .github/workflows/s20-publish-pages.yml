name: S20 publish pages

on:
  push:
    branches: [s20-page-0321-check]
    paths:
      - '.github/workflows/s20-publish-pages.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S20 staging data
        uses: actions/checkout@v4
        with:
          ref: s20-page-0321-check
          path: staging
          fetch-depth: 1
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct, validate, and publish one page per commit
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/s20-pages
          test "$(find staging/.s20-upload -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 9
          cat staging/.s20-upload/chunk-* | base64 -d > /tmp/s20-pages.tar.xz
          tar -xJf /tmp/s20-pages.tar.xz -C /tmp/s20-pages

          cat >/tmp/s20-checksums <<'EOF'
          2e61fc2162d6728305c4b2e1946628e160c967e85f4e1ab9bd0eb3fb41e86aab  /tmp/s20-pages/PAGE_0322.json
          54fd066d97b8280add146e27d04aab1aa6cbab3c4b358f248bd91c3b7a52e85a  /tmp/s20-pages/PAGE_0323.json
          c7eb0309cb1defdf667c96c98256e9a8f072508b2f14767357ab736eab5d2b47  /tmp/s20-pages/PAGE_0324.json
          46dbab9b15cd74efd009e098ff3db9cbec8afe90d95fbb6923de7d257f9fd92c  /tmp/s20-pages/PAGE_0325.json
          54c167db2899f4e27a8a026e42e93d736e0cf7f41472a48bffc53304f9638876  /tmp/s20-pages/PAGE_0326.json
          18156b7740587740c2d03ec20c1240d8a840a8298e7185a351fbb947cb64bb82  /tmp/s20-pages/PAGE_0327.json
          c057e102ab16aed9a960619bb8bcdab2fb05ba156943e277c47f4024765fc9c8  /tmp/s20-pages/PAGE_0328.json
          b8ab748e17167bfd6397865d5060b2f9f4dbd33420830f4559659f9c6355c781  /tmp/s20-pages/PAGE_0329.json
          7e0314d45830bc5d1e626021d56c315cf569a4740115c4b3cd20f13a6938897d  /tmp/s20-pages/PAGE_0330.json
          EOF
          sha256sum --check /tmp/s20-checksums

          cd repo
          git config user.name 'TRAIL FUSION AI'
          git config user.email 'hiroakiyasa@yahoo.co.jp'

          for number in $(seq 322 330); do
            page=$(printf '%04d' "$number")
            source="/tmp/s20-pages/PAGE_${page}.json"
            target="question-sets/PAGE_${page}.json"
            attempts=0

            while :; do
              attempts=$((attempts + 1))
              git fetch origin main
              git reset --hard origin/main

              if [ -e "$target" ]; then
                echo "$target already exists on main; preserving it without overwrite."
                break
              fi

              cp "$source" "$target"
              node scripts/validate-question-set.mjs "$target"
              git add "$target"
              git commit -m "feat(questions): add grammar mastery set for page ${page}"

              if git push origin HEAD:main; then
                echo "published PAGE_${page}: $(git rev-parse HEAD)"
                break
              fi

              if [ "$attempts" -ge 30 ]; then
                echo "failed to publish PAGE_${page} after ${attempts} attempts"
                exit 1
              fi

              echo "main advanced while publishing PAGE_${page}; retrying"
              sleep 2
            done
          done
