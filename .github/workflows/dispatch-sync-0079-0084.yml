name: Dispatch question progress sync 0079-0084

on:
  push:
    branches:
      - 'automation/dispatch-sync-0079-0084-20260829'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing sync workflow on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sync-question-progress.yml/dispatches" \
            --data '{"ref":"main"}'
      - name: Remove temporary dispatch branch
        if: always()
        shell: bash
        run: |
          git push "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            --delete automation/dispatch-sync-0079-0084-20260829 || true
